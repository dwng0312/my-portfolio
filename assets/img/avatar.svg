<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="accentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Light Clean Background -->
  <rect width="400" height="400" rx="40" fill="url(#avatarGrad)" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#e2e8f0" stroke-width="1.5">
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="320" x2="400" y2="320" />
  </g>

  <!-- Monogram Disc -->
  <circle cx="200" cy="165" r="85" fill="#ffffff" stroke="url(#accentRing)" stroke-width="4" />
  <text x="200" y="185" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="54" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-1">TD</text>

  <!-- Base Body Curve -->
  <path d="M 115 375 C 120 280, 280 280, 285 375" fill="#ffffff" stroke="url(#accentRing)" stroke-width="4" />
  
  <!-- Pill Badge -->
  <rect x="110" y="325" width="180" height="38" rx="19" fill="#0f172a" />
  <circle cx="132" cy="344" r="5" fill="#10b981" />
  <text x="210" y="349" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">TRAM DUONG</text>
</svg>